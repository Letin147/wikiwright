name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Sync environment
        run: uv sync
      - name: Ruff (zero-warning gate)
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest
      - name: Import-linter (dependency direction gate)
        run: uv run lint-imports
      - name: CLI entry point works
        run: uv run wikiwright --version

  hygiene:
    name: Directory hygiene (manual/02 §12, C-12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No forbidden files tracked
        shell: bash
        run: |
          bad=$(git ls-files | grep -E '(^|/)(wiki|\.cache|__pycache__|wikiwright-output|runs)(/|$)|\.tmp$|^\.env$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Forbidden files tracked (see manual/02 C-12):${bad}"
            exit 1
          fi
          echo "Hygiene OK — no caches, outputs, or secrets tracked."

  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all commits for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
