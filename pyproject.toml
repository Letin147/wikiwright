[project]
name = "wikiwright"
version = "0.1.0.dev0"
description = "An agent crew that forges — and keeps alive — the wiki your codebase deserves."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "WikiWright contributors" }]
keywords = ["deepwiki", "wiki", "agents", "langgraph", "mcp", "documentation", "code-intelligence"]

dependencies = [
    "typer>=0.12",
    "rich>=13",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "pydantic>=2.7",
]

[project.scripts]
wikiwright = "wikiwright.cli.app:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pre-commit>=3.7",
    "import-linter>=2.0",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikiwright"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# typer 的设计就是把 Option/Argument 放在默认值里，B008 豁免
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# 依赖方向门禁（manual/02 §4；随 EXP 推进扩展 ingest/wiki/models 层）
[tool.importlinter]
root_package = "wikiwright"

[[tool.importlinter.contracts]]
name = "UI shells are independent"
type = "independence"
modules = ["wikiwright.cli", "wikiwright.web", "wikiwright.mcp"]

[[tool.importlinter.contracts]]
name = "Agents sit above core"
type = "layers"
layers = ["wikiwright.agents", "wikiwright.core"]
